services:
  - type: web
    runtime: static
    name: metabook-ai-web
    buildCommand: node scripts/verify-unity-build.mjs
    staticPublishPath: ./dist
    headers:
      - path: /Build/*.framework.js.gz
        name: Content-Encoding
        value: gzip
      - path: /Build/*.framework.js.gz
        name: Content-Type
        value: application/javascript
      - path: /Build/*.wasm.gz
        name: Content-Encoding
        value: gzip
      - path: /Build/*.wasm.gz
        name: Content-Type
        value: application/wasm
      - path: /Build/*.data.gz
        name: Content-Encoding
        value: gzip
      - path: /Build/*.data.gz
        name: Content-Type
        value: application/octet-stream
      - path: /Build/*.symbols.json.gz
        name: Content-Encoding
        value: gzip
      - path: /Build/*.symbols.json.gz
        name: Content-Type
        value: application/octet-stream
